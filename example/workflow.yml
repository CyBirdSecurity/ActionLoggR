name: CI with Egress Monitoring

on:
  push:
    branches: [main]
  pull_request:

# Permissions: no elevated permissions are needed for basic ActionLoggR usage.
# Only add these if you are using the optional features below:
#   id-token: write        → needed for OIDC-authenticated webhook delivery
#   security-events: write → needed to upload SARIF to the GitHub Security tab
# Remove this block entirely if you are not using those features.
permissions:
  contents: read
  id-token: write          # remove if not using webhook-url
  security-events: write   # remove if not using GitHub Security tab integration

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Start ActionLoggR — a single step is all you need ────────────────
      # GitHub automatically runs the post: hook after all job steps complete,
      # so the monitor stays active across your entire build without an explicit
      # stop step. Add any optional inputs here; outputs are set by the post hook.
      - name: ActionLoggR
        id: actionloggr
        uses: drewklauser/ActionLoggR@main
        with:
          # Comma-separated IoCs, or a URL to a newline-delimited blocklist:
          ioc-list: |
            evil.example.com,
            malware-c2.net,
            https://raw.githubusercontent.com/example/ioc-feed/main/domains.txt
          # Optional: POST the full JSON report to your SIEM / log aggregator.
          webhook-url: ${{ secrets.ACTIONLOGGR_WEBHOOK_URL }}
          # Set to 'true' to fail the job when an IoC match is detected.
          fail-on-match: 'true'
          report-all-traffic: 'true'
          output-dir: '/tmp/actionloggr'
          # Optional BPF filter to narrow capture scope.
          # capture-filter: 'not port 22'

      # ── 2. Your normal build steps go here ──────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The post: hook runs automatically after all steps above complete.
      # It stops the monitor, generates the report, and uploads it as a
      # workflow artifact named actionloggr-{run_id}. No additional steps needed.
