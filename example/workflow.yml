name: CI with Egress Monitoring

on:
  push:
    branches: [main]
  pull_request:

# OIDC permissions required for ActionLoggR webhook authentication
permissions:
  contents: read
  id-token: write          # needed for OIDC token → webhook auth
  security-events: write   # needed to upload SARIF to Security tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Start egress monitor FIRST ──────────────────────────────────────
      - name: Start ActionLoggR
        uses: drewklauser/ActionLoggR@main
        id: monitor-start
        with:
          # Comma-separated IoCs, or a URL to a newline-delimited blocklist:
          ioc-list: |
            evil.example.com,
            malware-c2.net,
            https://raw.githubusercontent.com/example/ioc-feed/main/domains.txt
          # Optional: POST the full JSON report to your SIEM / log aggregator.
          # ActionLoggR attaches a GitHub Actions OIDC token so your receiver
          # can verify the request came from a legitimate Actions run.
          webhook-url: ${{ secrets.ACTIONLOGGR_WEBHOOK_URL }}
          # Set to 'true' to fail the job when an IoC match is detected.
          fail-on-match: 'true'
          # Include every observed domain/IP in the report (not just matches).
          report-all-traffic: 'true'
          # Optional BPF filter to narrow capture (default: exclude SSH port).
          # capture-filter: 'not port 22 and not port 443'
          output-dir: '/tmp/actionloggr'

      # ── 2. Your normal build steps go here ─────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # ── 3. ActionLoggR auto-runs its post step (always, even on failure) ───
      # Results are available via outputs:
      - name: Show monitoring results
        if: always()
        run: |
          echo "Report:       ${{ steps.monitor-start.outputs.report-path }}"
          echo "SARIF:        ${{ steps.monitor-start.outputs.sarif-path }}"
          echo "IoC matches:  ${{ steps.monitor-start.outputs.ioc-matches }}"

      # ── 4. (Optional) upload report as an artifact for manual review ────────
      - name: Upload ActionLoggR report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actionloggr-report
          path: /tmp/actionloggr/
          retention-days: 30
